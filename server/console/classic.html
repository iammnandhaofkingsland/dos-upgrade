<style>

.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.sig svg{width:100%;height:30px}.mc{border-top:4px solid var(--green)}.mc.warning{border-top-color:#F9AB00}.mc.alarm{border-top-color:var(--red);box-shadow:0 0 0 2px #F2B8B5}.mc.maintenance{border-top-color:var(--blue)}
.mc .t{font-weight:700}.mc .s{font-size:11.5px;color:var(--muted)}.sig{display:grid;grid-template-columns:72px minmax(0,1fr) 66px;align-items:center;gap:6px;font-size:12px;margin-top:4px}.sig .v{text-align:right;font-weight:700}.sig .v.al{color:var(--red)}.sig .v.wn{color:#B06000}

<div class="app">
  <aside class="side">
    <div class="logo"><svg viewBox="0 0 512 512" width="30" height="30" aria-hidden="true"><defs><linearGradient id="lgt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4566FF"/><stop offset="1" stop-color="#7B5CFF"/></linearGradient></defs><g transform="translate(256 256) scale(0.96) translate(-254 -254)"><path d="M224.5 367.8 A132 132 0 0 1 151.9 334.5" fill="none" stroke="#19E3CF" stroke-width="46"/><path d="M140.3 321.7 A132 132 0 0 1 107.4 258.3" fill="none" stroke="#19BDE8" stroke-width="46"/><path d="M105.1 241.9 A132 132 0 0 1 132.9 163.4" fill="none" stroke="#2C8EF6" stroke-width="46"/><path d="M143.4 150.6 A132 132 0 0 1 210.9 108.4" fill="none" stroke="#4566FF" stroke-width="46"/><path d="M227.3 104.2 A132 132 0 0 1 307.4 125.6" fill="none" stroke="#7B5CFF" stroke-width="46"/><line x1="331" y1="331" x2="378" y2="378" stroke="url(#lgt)" stroke-width="46" stroke-linecap="round"/><circle cx="393" cy="393" r="30" fill="#fff"/><circle cx="236" cy="236" r="22" fill="#fff"/></g></svg><div><b>DOS</b><small>DigiQuench OS</small></div></div>

<script>
// ---------- tiny framework ----------
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); // model, tool and data output is untrusted: always escape
const LS = (k, d) => localStorage.getItem(k) || d;
const TOKEN = () => localStorage.getItem("dos_token") || "";
async function api(path, opts = {}) {
  const headers = {"Content-Type": "application/json", ...(opts.headers || {})};
  if (TOKEN()) headers.Authorization = "Bearer " + TOKEN();
  const res = await fetch("/api" + path, {...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined});
  if (res.status === 401 && !path.startsWith("/auth")) { signOut(); throw new Error("Please sign in"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}
const fmtT = (ts) => ts ? new Date(ts * 1000).toLocaleString("en-IN", {day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "";
const rs = (v) => v == null ? "-" : "₹" + Number(v).toLocaleString("en-IN", {maximumFractionDigits: 2});
const ms = (v) => v == null ? "-" : (v >= 1000 ? (v / 1000).toFixed(1) + " s" : v + " ms");
const pct = (v) => v == null ? "-" : Math.round(v * 100) + "%";
const STATUS = {completed: "p-green", live: "p-green", active: "p-green", approved: "p-green", ok: "p-green", done: "p-green", sample: "p-green", upload: "p-green", closed: "p-green", read: "p-grey", running: "p-blue", evaluating: "p-blue", configured: "p-blue", waiting_approval: "p-amber", pending: "p-amber", paused: "p-amber", scheduled: "p-amber", open: "p-amber", failed: "p-red", rejected: "p-red", error: "p-red", blocked: "p-red", denied: "p-red", stopped: "p-red", cancelled: "p-grey", none: "p-red", available: "p-grey", superseded: "p-grey", rolled_back: "p-grey", applied: "p-amber", awaiting_approval: "p-amber", High: "p-red", Medium: "p-amber", Low: "p-green", Restricted: "p-red", Confidential: "p-amber", Internal: "p-blue", Public: "p-grey"};
const WORDS = {none: "not connected", sample: "sample data", upload: "your file"};
const pill = (s, text) => `<span class="pill ${STATUS[s] || "p-grey"}">${esc(text || WORDS[s] || String(s).replace(/_/g, " "))}</span>`;
const AUT = {suggest: ["Suggests only", "p-grey"], approve: ["Acts with approval", "p-amber"], auto: ["Acts within limits", "p-green"]};
const LNAME = {1: "Experience", 2: "Client rules", 3: "Data", 4: "Agent", 5: "Safety"};
const ltag = (n) => `<span class="lt l${n}" title="Layer ${n}: ${LNAME[n]}">L${n}</span>`;
let META = {}, timer = null;
const can = (p) => (META.permissions || []).includes(p);
const dis = (p) => can(p) ? "" : `disabled title="Your role (${esc(META.role)}) cannot do this"`;
const NAV = [["overview", "Overview", 0],
  ["#plant", "Live plant"], ["plant", "Plant floor"], ["workorders", "Work orders"],
  [2, "Client rules"], ["config", "Client configuration"],
  [3, "Data"], ["data", "Data sources"], ["dataaccess", "Data access log"],
  [4, "AI agents"], ["catalog", "Agent Catalog"], ["agents", "My Agents"], ["runs", "Runs & Traces"], ["actions", "Actions taken"], ["builder", "Agent Builder"],
  [5, "Safety & governance"], ["approvals", "Approvals"], ["governance", "Governance"], ["selftest", "Safety self-test"], ["incidents", "Incidents"], ["audit", "Audit & evidence"]];
const TECH_NAV = [["#plant", "Live plant"], ["workorders", "My work orders"], ["plant", "Plant floor"]];
const LANDING = {owner: "overview", operator: "plant", approver: "approvals", technician: "workorders", auditor: "governance"};
const ROLE_SEES = {owner: "Everything: the five-layer overview, client rules, data, agents, approvals and governance.",
  operator: "Plant floor, agents, runs and traces. Can simulate a machine fault for the demo.",
  approver: "Approvals inbox (spare-part orders, lot holds), plant floor, emergency stop.",
  technician: "Own work orders: acknowledge, repair, confirm the cause. Plant floor.",
  auditor: "Read-only: every trace, the audit chain, the evidence pack, the safety self-test."};
function navItems() {
  if (META.role === "technician") return TECH_NAV;
  let items = NAV;
  if (!META.plant) { const a = items.findIndex((x) => x[0] === "#plant"); items = items.slice(0, a).concat(items.slice(a + 3)); }
  return items;
}
async function drawNav(active) {
  let pending = 0, open = 0, mine = 0;
  try { if (META.role !== "technician") { pending = (await api("/approvals")).length; open = (await api("/governance/incidents?status=open")).length; } if (META.plant) mine = (await api("/workorders?mine=true")).filter((w) => w.status !== "resolved").length; } catch (e) {}
  const badge = (id) => id === "approvals" && pending ? `<span class="badge">${pending}</span>` : id === "incidents" && open ? `<span class="badge">${open}</span>` : id === "workorders" && mine ? `<span class="badge">${mine}</span>` : "";
  $("#nav").innerHTML = navItems().map(([id, label]) => typeof id === "number" ? `<div class="sec"><span class="ln l${id}">${id}</span>${label}</div>`
    : id.startsWith("#") ? `<div class="sec"><span class="ln" style="background:#F59E0B">⚙</span>${label}</div>` : `<a href="#/${id}" class="${active === id ? "on" : ""}">${label}${badge(id)}</a>`).join("");
}
let DEMO = null;
async function drawWho() {
  const u = META.user || {name: META.actor, role: META.role};
  const initials = (u.name || "?").split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  try { DEMO = await (await fetch("/api/auth/demo-users?client=" + encodeURIComponent(META.client.id))).json(); } catch (e) { DEMO = null; }
  const sw = DEMO && DEMO.enabled && DEMO.users.length ? `<label>Reviewer: switch role</label><select onchange="if(this.value)doLogin('${esc(META.client.id)}',this.value,DEMO.password)"><option value="">${esc(u.name)} (${esc(META.role)})</option>${DEMO.users.filter((x) => x.username !== (u.username || "")).map((x) => `<option value="${esc(x.username)}">${esc(x.name)}: ${esc(x.title)}</option>`).join("")}</select>` : "";
  $("#who").innerHTML = `<div class="user"><div class="avatar">${esc(initials)}</div><div><div class="nm">${esc(u.name)}</div><div class="tt">${esc(u.title || META.role)}</div></div></div>
    <div class="co">${esc(META.client.name)}</div>${sw}<button class="btn" onclick="signOut()">Sign out</button>`;
}
function signOut() { localStorage.removeItem("dos_token"); META = {}; clearTimeout(timer); showLogin(localStorage.getItem("dos_client")); }
async function doLogin(client, username, password) {
  try {
    const res = await fetch("/api/auth/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({client, username, password})});
    const data = await res.json(); if (!res.ok) throw new Error(data.detail || "Sign-in failed");
    localStorage.setItem("dos_token", data.token); localStorage.setItem("dos_client", client);
    META = {}; WZ = {}; modal(""); $("#login").style.display = "none"; $(".app").style.display = "";
    const me = await api("/meta"); location.hash = "#/" + (me.plant || !["operator"].includes(me.role) ? LANDING[me.role] : "agents"); route();
  } catch (e) { const el = $("#lgerr"); if (el) el.textContent = e.message; else toast(e.message); }
}

  const runs = (i.runs || []).map((r) => `<a class="chipl" href="#/run/${r.run_id}">${esc(r.agent)} ${r.status === "completed" ? "✓" : r.status === "waiting_approval" ? "⏳" : "!"}</a>`).join("");
  return `<div class="card" style="margin-bottom:10px;border-left:4px solid ${i.status === "resolved" ? "var(--green)" : "var(--red)"}"><div class="row sp"><b>${esc(i.machine_name)} (${esc(i.machine)})</b>${pill(i.status === "resolved" ? "done" : "open", i.status)}</div>
    <div class="sub">${esc(i.signal.replace("_", " "))} ${esc(i.value)} ${esc(i.unit)} beyond limit ${esc(i.limit)} · detected ${hhmmss(i.detected_at)}${i.status === "resolved" && i.resolved_at ? ` · machine back in ${dur(i.resolved_at - i.detected_at)}` : ""}</div>
    ${i.root_cause ? `<div style="margin:6px 0"><b>Likely cause:</b> ${esc(i.root_cause)} <span class="pill p-purple">${Math.round(i.confidence * 100)}%</span> ${i.technician ? `· <b>Technician:</b> ${esc(i.technician)}` : ""} ${i.work_order ? `· <span class="mono">${esc(i.work_order)}</span>` : ""}</div>` : ""}
    <div style="margin:4px 0 8px">${runs}</div><div class="tl2">${i.timeline.map((t) => `<div><span class="tm">${hhmmss(t.at)}</span><b>${esc(t.who)}</b> ${esc(t.what)}</div>`).join("")}</div></div>`;
}
async function plantTick() {
  clearTimeout(timer);
  if (!location.hash.startsWith("#/plant") && !(location.hash === "" && LANDING[META.role] === "plant")) return;
  const box = $("#plantlive"); if (!box) return;
  try {
    const st = await api("/plant/state"); const k = st.kpis;
    const open = st.incidents.filter((i) => i.status !== "resolved"), done = st.incidents.filter((i) => i.status === "resolved").slice(0, 3);
    box.innerHTML = `<div class="grid g4" style="grid-template-columns:repeat(6,1fr)">${kpi("Machines running", `${k.running} / ${k.machines}`, `${k.attention} need attention`)}${kpi("Open incidents", k.open_incidents, k.auto_response ? "Automatic response ON" : "Automatic response OFF")}
      ${kpi("Alarm to technician", k.avg_min_to_technician == null ? "-" : k.avg_min_to_technician < 1 ? dur(k.avg_min_to_technician * 60) : k.avg_min_to_technician + " min", "Average, all incidents")}${kpi("Time to acknowledge", k.avg_min_to_acknowledge == null ? "-" : k.avg_min_to_acknowledge < 1 ? dur(k.avg_min_to_acknowledge * 60) : k.avg_min_to_acknowledge + " min", "Technician response")}
      ${kpi("Time to resolve", k.avg_min_to_resolve == null ? "-" : k.avg_min_to_resolve < 1 ? dur(k.avg_min_to_resolve * 60) : k.avg_min_to_resolve + " min", "Alarm to machine running")}${kpi("Downtime cost", rs(k.downtime_cost_inr), `At ${rs(k.cost_per_hour_inr)} per hour (client rule)`)}</div>
      <div style="margin-top:14px"><div><div class="mgrid">${st.machines.map((m) => `<div class="card mc ${m.status}"><div class="row sp"><div><div class="t">${esc(m.name)}</div><div class="s">${esc(m.machine_id)} · ${esc(m.line)}</div></div>${pill(m.status === "running" ? "ok" : m.status === "alarm" ? "failed" : m.status === "warning" ? "pending" : "running", m.status)}</div>
        ${Object.keys(m.latest).map((s) => spark(m, s)).join("")}${m.simulated_fault ? `<div class="sub" style="margin-top:6px;color:#B06000">Simulated fault (presenter only): ${esc(m.simulated_fault)}</div>` : ""}</div>`).join("")}</div></div>
        <div class="card" style="margin-top:14px"><h2>Incidents: what DOS did, step by step</h2>${open.length ? `<div class="grid g2">${open.map(incidentCard).join("")}</div>` : `<div class="empty">No open incidents. Every machine is inside its limits.</div>`}${done.length ? `<h3 style="margin-top:12px">Recently resolved</h3><div class="grid g2">${done.slice(0, 2).map(incidentCard).join("")}</div>` : ""}</div></div>`;
  } catch (e) { box.innerHTML = `<div class="note">${esc(e.message)}</div>`; }
  timer = setTimeout(plantTick, 2000);
}
async function simFault() { try { const r = await api("/plant/faults", {method: "POST", body: {machine: $("#simm").value, fault: $("#simf").value}}); toastSoft(r.note); } catch (e) { toast(e.message); } }
async function simReset() { try { await api("/plant/clear/" + $("#simm").value, {method: "POST"}); } catch (e) { toast(e.message); } }
function toastSoft(msg) { const el = $("#simmsg"); if (el) el.textContent = msg; }
pages.plant = async () => {
  if (!META.plant) return `<div class="note">This company has no live plant connected.</div>`;
  const st = await api("/plant/state");
  const sim = can("plant.simulate") ? `<div class="simbar"><b>Demo control (presenter only):</b> make a machine drift the way a real fault would. DOS is not told which fault; it must detect and diagnose it.
    <select id="simm" onchange="simFilter()">${st.machines.map((m) => `<option value="${esc(m.machine_id)}" data-type="${esc(m.type)}">${esc(m.machine_id)} ${esc(m.name)}</option>`).join("")}</select>
    <select id="simf">${Object.entries(st.faults).map(([k, f]) => `<option value="${esc(k)}" data-types="${esc(f.types.join(","))}">${esc(f.label)}</option>`).join("")}</select>
    <button class="btn no" onclick="simFault()">Simulate fault</button><button class="btn" onclick="simReset()">Reset machine</button><span id="simmsg" class="sub"></span></div>` : "";
  setTimeout(simFilter, 0);
  return head("Plant floor", "Live condition of every machine, every 2 seconds. A confirmed alarm starts the six-agent downtime response automatically.", "", 4) + sim + `<div id="plantlive"><div class="empty">Loading the plant...</div></div>`;
};
function simFilter() { const m = $("#simm"), f = $("#simf"); if (!m || !f) return; const t = m.selectedOptions[0].dataset.type; let first = null; [...f.options].forEach((o) => { const okk = o.dataset.types.split(",").includes(t); o.hidden = !okk; if (okk && !first) first = o; }); if (f.selectedOptions[0].hidden && first) f.value = first.value; }
const WOS = {assigned: "p-amber", acknowledged: "p-blue", in_progress: "p-purple", resolved: "p-green", unassigned: "p-red"};
let CAUSES = [];
pages.workorders = async () => {
  if (!META.plant) return `<div class="note">This company has no live plant connected.</div>`;
  const rows = await api("/workorders" + (META.role === "technician" ? "?mine=true" : ""));
  CAUSES = await api("/plant/causes");
  const mine = META.role === "technician";
  const act = (w) => !can("workorder.update") || (mine && w.technician_id !== (META.user || {}).technician_id) ? "" :
    w.status === "assigned" ? `<button class="btn pri" onclick="woAct('${w.id}','ack')">Acknowledge</button>` : w.status === "acknowledged" ? `<button class="btn pri" onclick="woAct('${w.id}','start')">Start repair (lock out machine)</button>` : w.status === "in_progress" ? `<button class="btn ok" onclick="woResolve('${w.id}')">Close: confirm cause</button>` : "";
  return head(mine ? "My work orders" : "Work orders", mine ? "Breakdowns assigned to you by FixDispatch, with the diagnosis and the part. Acknowledge quickly: DOS escalates to your supervisor if you do not." : "Every maintenance work order created by FixDispatch, and where it stands.", "", 5) +
    (rows.length ? `<div class="grid g2">${rows.map((w) => `<div class="card" style="border-left:4px solid ${w.status === "resolved" ? "var(--green)" : w.escalated ? "var(--red)" : "var(--blue)"}"><div class="row sp"><div><b>${esc(w.title)}</b><div class="sub"><span class="mono">${esc(w.id)}</span> · ${esc(w.machine_name)} (${esc(w.machine)}) · priority ${esc(w.priority)}</div></div><span class="pill ${WOS[w.status] || "p-grey"}">${esc(w.status.replace("_", " "))}</span></div>
      <div style="margin:8px 0"><b>Diagnosis from DOS:</b> ${esc(w.diagnosis)}</div>${kv([["Technician", esc(w.technician_name || "unassigned")], ["Spare part", esc(w.part || "none")], ["Assigned", fmtT(w.assigned_at)], ["Acknowledged", fmtT(w.acknowledged_at) || (w.escalated ? `<span style="color:var(--red)">Not acknowledged in time: escalated to supervisor</span>` : "waiting")], ["Resolved", w.resolution ? `${fmtT(w.resolved_at)}: ${esc(w.resolution.confirmed_cause.replace(/_/g, " "))}, ${w.resolution.minutes} min. ${esc(w.resolution.notes)}` : "-"]])}
      <div class="row" style="margin-top:10px">${act(w)}</div></div>`).join("")}</div>` : `<div class="card empty">${mine ? "Nothing assigned to you. When a machine alarm is diagnosed, your work order appears here." : "No work orders yet."}</div>`);
};
async function woAct(id, action) { try { await api(`/workorders/${id}/${action}`, {method: "POST", body: {}}); route(); } catch (e) { toast(e.message); } }
function woResolve(id) {
  modal(`<h2>Close work order</h2><div class="sub">Confirm what the cause really was. Your answer is added to the repair history, so RootCauseIQ learns from it.</div>
    <label>Confirmed cause</label><select id="woc">${CAUSES.map((c) => `<option value="${esc(c.key)}">${esc(c.label)}</option>`).join("")}</select>
    <label>What you found and did</label><textarea id="won" placeholder="For example: front bearing pitted, replaced the matched pair, set preload, ran in at 50 percent speed."></textarea>
    <label>Repair minutes</label><input id="wom" type="number" value="60" min="1">
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="modal('')">Cancel</button><button class="btn ok" onclick="woClose('${id}')">Close and return machine to production</button></div>`);
}
async function woClose(id) { try { await api(`/workorders/${id}/resolve`, {method: "POST", body: {confirmed_cause: $("#woc").value, notes: $("#won").value, minutes: Number($("#wom").value)}}); modal(""); route(); } catch (e) { toast(e.message); } }

// ---------- router ----------
async function route() {
  clearTimeout(timer);
  if (!TOKEN()) return showLogin(localStorage.getItem("dos_client"));
  const [, page = "", arg, arg2] = location.hash.split("/");
  try { if (!META.client) { META = await api("/meta"); await drawWho(); } else { META.kill = (await api("/meta")).kill; } }
  catch (e) { return; }
  const name = page || LANDING[META.role] || "overview";
  const fn = pages[name] || pages.overview;
  try { $("#view").innerHTML = await fn(arg, arg2); } catch (e) { $("#view").innerHTML = `<div class="note">${esc(e.message)}</div>`; }
  drawNav(name === "agent" ? "agents" : name === "run" ? "runs" : name);
  if (name === "plant") plantTick();
}
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
